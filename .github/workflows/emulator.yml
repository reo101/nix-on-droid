name: Test nix-on-droid in an emulator
on:
  pull_request:
  push:
  schedule:
    - cron: 0 0 * * 1

jobs:

  prepare-droidctl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      path: ${{ steps.droidctl-build.outputs.path }}
    steps:
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@master
      - name: Configure Nix cache
        uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      - name: Build droidctl
        id: droidctl-build
        run: |
          nix build 'github:t184256/droidctl' --out-link /tmp/droidctl
          echo "path=$(realpath /tmp/droidctl)" >> "$GITHUB_OUTPUT"


  prepare-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@master
      - name: Setup cachix (sparkles' Android toolchain)
        uses: cachix/cachix-action@v14
        with:
          name: sparkles

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the app (the sparkles terminal)
        run: |
          nix build .#sparkles-terminal-apk --out-link apk
          cp apk/sparkles-terminal-nix.apk nix-on-droid.apk

      - name: Store the app
        uses: actions/upload-artifact@v4
        with:
          name: nix-on-droid.apk
          path: nix-on-droid.apk
          retention-days: 2


  prepare-n-o-d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [termux, sparkles-terminal]  # keep in sync with emulate
    env:
      NOD_APP: ${{ matrix.app }}
    steps:
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@master
      - name: Setup cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-on-droid
      - name: Configure Nix cache
        uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zipball and channel tarball to inject (n-o-d)
        id: injection-build
        run: |
          rm -rf n-o-d
          mkdir -p n-o-d
          git -C . archive --format=tar.gz --prefix n-o-d/ HEAD > n-o-d/archive.tar.gz
          ANDROID_APP_ID="$(cd tests/emulator && python -m apps)"
          export ANDROID_APP_ID
          ARCHES=x86_64 nix run '.#deploy' -- file:///data/local/tmp/n-o-d/archive.tar.gz n-o-d/
          tar cf n-o-d.tar n-o-d

      - name: Store zipball and channel tarball to inject (n-o-d)
        uses: actions/upload-artifact@v4
        with:
          name: n-o-d-${{ matrix.app }}.tar
          path: n-o-d.tar
          retention-days: 2


  emulate:
    needs:
      - prepare-droidctl
      - prepare-n-o-d
      - prepare-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOD_APP: ${{ matrix.app }}

    strategy:
      fail-fast: false
      matrix:
        app: [termux, sparkles-terminal]  # keep in sync with prepare-n-o-d
        api-level: [29]
        # below 28: bootstrap didn't start, IDK why
        # 34: sometimes work, but doesn't seem stable, even w/o caching images
        script:
          - android_integration
          - bootstrap_flakes
          - bootstrap_channels
          - poke_around
          - test_channels_uiautomator
          - test_channels_shell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve zipball and channel tarball to inject (n-o-d)
        uses: actions/download-artifact@v4
        with:
          name: n-o-d-${{ matrix.app }}.tar

      - name: Unpack zipball and channel tarball to inject (n-o-d)
        run: tar xf n-o-d.tar

      - name: Retrieve the app
        if: matrix.app == 'sparkles-terminal'
        uses: actions/download-artifact@v4
        with:
          name: nix-on-droid.apk

      - name: Select the local APK
        if: matrix.app == 'sparkles-terminal'
        run: echo "NOD_APK=$PWD/nix-on-droid.apk" >> "$GITHUB_ENV"

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@master
      - name: Configure Nix cache
        uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch droidctl (using previous eval)
        id: droidctl-fetch
        env:
          DROIDCTL: ${{needs.prepare-droidctl.outputs.path}}
        run: nix build "$DROIDCTL" --out-link /tmp/droidctl
        continue-on-error: true  # GitHub Actions can throttle cache-nix-action

      - name: Build droidctl (anew, fallback)
        if: always() && (steps.droidctl-fetch.outcome == 'failure')
        run: nix build 'github:t184256/droidctl' --out-link /tmp/droidctl

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test app=${{ matrix.app }} script=${{ matrix.script }} api-level=${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: default
          arch: x86_64
          api-level: ${{ matrix.api-level }}
          # Restored snapshots can report boot complete without Android services.
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # https://github.com/ReactiveCircus/android-emulator-runner/issues/385
          script: >
            trap 'pkill --exact --echo --signal SIGKILL crashpad_handle || true' EXIT &&
            adb shell 'rm -rf /data/local/tmp/n-o-d' &&
            adb push n-o-d /data/local/tmp/ &&
            echo 'pushed' &&
            adb shell 'cd /data/local/tmp/n-o-d && tar xzof archive.tar.gz && mv n-o-d unpacked' &&
            echo 'unpacked' &&
            cd tests/emulator &&
            adb shell settings put secure enabled_accessibility_services com.google.android.marvin.talkback/com.google.android.marvin.talkback.TalkBackService &&
            echo 'ready' &&
            /tmp/droidctl/bin/droidctl run ${{ matrix.script }}.py
            # TODO: push to cachix from within the emulator?
            #       would be of use on aarch64, not x86_64

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.app }}-${{ matrix.script }}-${{ matrix.api-level }}
          path: tests/emulator/screenshots
          if-no-files-found: warn # 'error' or 'ignore' are also available
